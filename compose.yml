services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/fincore
      DB_USERNAME: fincore
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DEMO_SEED: ${DEMO_SEED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - backend
volumes:
  postgres_data:
